<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hai phoebe...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vday.css">
</head>
<body>
    
    <div id="gameScreen" class="screen active">
        <div class="container">
            <div class="title"> Hai phoebe.....</div>
            <div class="instructions">Use wasd to move around and collect pokeballs!!</div>
            <canvas id="gameCanvas"></canvas>
            <div class="stats">
                <div>Pokéballs Collected: <span id="pokeballsCount">0</span> / <span id="totalPokeballs">15</span></div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
                <div class="message" id="message"></div>
            </div>
        </div>
    </div>

    <div id="questionScreen" class="screen">
        <div class="container question-container">
            <div class="question-title">will you be my valentine?</div>
            <div class="eevee-container">
                <canvas id="questionCanvas"></canvas>
            </div>
            <div class="button-container">
                <button id="yesButton" class="valentine-button yes-button">YES!!!</button>
                <button id="noButton" class="valentine-button no-button">No</button>
            </div>
        </div>
    </div>

    
    <div id="galleryScreen" class="screen">
        <div class="container gallery-container">
            <div class="gallery-title">YAY SHE SAID YES GF!</div>
            <div id="photoGallery" class="photo-gallery">
                <img src="photos/Screenshot%202026-02-04%20220107.png" alt="Photo 1" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220440.png" alt="Photo 2" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220452.png" alt="Photo 3" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220500.png" alt="Photo 4" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220507.png" alt="Photo 5" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220513.png" alt="Photo 6" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220518.png" alt="Photo 7" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220524.png" alt="Photo 8" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220531.png" alt="Photo 9" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220537.png" alt="Photo 10" class="gallery-photo">
                <img src="photos/Screenshot%202026-02-04%20220543.png" alt="Photo 11" class="gallery-photo">
            </div>
            <button id="backButton" class="valentine-button">Back to Game</button>
        </div>
    </div>

   
    <div id="sadScreen" class="screen">
        <div class="container sad-container">
            <div class="sad-title">Eevee is sad... /:</div>
            <div class="eevee-container">
                <canvas id="sadCanvas"></canvas>
            </div>
            <div class="sad-message"> eevees heart aches... </div>
            <button id="tryAgainButton" class="valentine-button">Try Again?</button>
        </div>
    </div>

    <!-- Audio element for gallery music -->
    <audio id="galleryMusic" loop preload="auto" crossorigin="anonymous">
        <source src="music.mp3" type="audio/mpeg">
        <source src="music.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <script src="vday.js"></script>
</body>
</html>
